# Prüft die Website bei jedem Push auf main und einmal täglich und rollt sie auf GitHub Pages aus.
# Der tägliche Lauf holt neue Repos in die Projektliste, auch ohne Push in dieses Repo.
# Die Actions sind auf Commit-Hashes festgelegt, Dependabot hält sie aktuell.
name: Website prüfen und ausrollen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    name: Bauen und prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ein "Re-run" baut den alten Commit noch einmal und würde ihn ausrollen.
      # Deshalb geht nur der Stand live, auf dem main gerade steht.
      - name: Nur den aktuellen Stand von main ausrollen
        run: |
          aktuell="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$aktuell" != "$GITHUB_SHA" ]; then
            echo "::error::Dieser Lauf baut ${GITHUB_SHA::7}, main steht aber auf ${aktuell::7}. Ein alter Stand wird nicht ausgerollt. Neu starten bitte über 'Run workflow' statt 'Re-run'."
            exit 1
          fi

      - name: Commit und Datum in die Seite schreiben
        run: |
          cp -r site _site
          kurz="${GITHUB_SHA::7}"
          stand="$(TZ=Europe/Berlin date +%d.%m.%Y)"
          sed -i "s/__COMMIT_KURZ__/${kurz}/g; s/__COMMIT__/${GITHUB_SHA}/g; s/__STAND__/${stand}/g" _site/index.html

      - name: Projektliste aus den Repos erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/projekte.py projekte.json _site/index.html "${GITHUB_REPOSITORY_OWNER}"

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: HTML prüfen
        run: npx --yes html-validate@11.21.1 _site

      - name: Seite als Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  ausrollen:
    name: Ausrollen
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
